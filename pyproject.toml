[project]
name = "anki-mastery"
version = "0.1.0"
description = "Brazilian-Portuguese frequency dataset pipeline for Anki"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Stage 1 (parse + normalize) needs only Anthropic for optional LLM
    # confirmation on ambiguous orthography and merge collisions.
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    # Stage 6/7 audio: ElevenLabs TTS, R2 upload, ASR roundtrip,
    # Levenshtein similarity for ASR comparisons.
    "elevenlabs>=1.5.0",
    "boto3>=1.34.0",
    "rapidfuzz>=3.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
